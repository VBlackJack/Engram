[database]
path = "engram.db"
busy_timeout_ms = 5000

[ttl_days]
preference = 0
decision = 0
fact = 0
project_state = 30
episode = 7
# An unattested candidate is bounded by this ceiling as well as by its kind, so a
# kind set to 0 above never grants a model's unreviewed guess the lifetime of a
# human-verified fact. Attesting one lifts the bound. Zero here restores the
# previous behaviour for an installation with its own retention story.
candidate_max_days = 90

[limits]
max_statement_chars = 2000
max_subject_keys = 8

[logging]
path = "logs/engram.log"
file_level = "INFO"
console_level = "INFO"

[attestation]
default_actor = "local-operator"

[server]
host = "127.0.0.1"
port = 8377
path = "/mcp"
write_wait_timeout_ms = 2000
ttl_sweep_interval_seconds = 60
# A client that initialises and then vanishes leaves a session behind; the MCP
# SDK reclaims one only on an explicit delete. This deadline reclaims the rest.
# Raise it if a client of yours legitimately idles longer between requests.
session_idle_timeout_seconds = 1800
# Hard ceiling: 524288 bytes. Lower values are allowed for constrained deployments.
max_request_body_bytes = 524288

[capsule]
default_token_budget = 4800
min_token_budget = 1200
# The ceiling a client may request. A conflict family of six versions needs more
# than 6000 serialized bytes, so a lower ceiling makes those memories unreachable
# through the MCP tools. Raising default_token_budget spends more tokens on every
# recall; measured with 300-character statements, 4800 returns about four entries
# and 16000 returns about fifteen.
max_token_budget = 32768

[retrieval]
mode = "fts"
# Hard-bounded lexical query and SQL result limits.
fts_top_k = 64
fts_max_query_chars = 1024
fts_max_query_terms = 24
fts_min_prefix_chars = 4
# Absolute deadline shared by phrase, AND, OR, and prefix stages.
fts_query_timeout_ms = 250
hybrid_max_candidates = 4096
embeddings_endpoint = "http://127.0.0.1:1234/v1/embeddings"
# Reference: nomic-embed-text-v1.5. Alternative: bge-m3.
embeddings_model = ""
embeddings_timeout_ms = 3000
rrf_k = 60

[datacron]
command = "datacron"
args = ["mcp", "serve"]
# Empty vault/read values inherit the Datacron server environment.
# An empty write_paths always disables writes, even if the parent environment allows them.
vault_root = ""
read_paths = []
write_paths = []
new_note_directory = "_memory/engram"
# Accepted range: 1..64. Search also caps single-term query variants at 8.
neighbor_limit = 8
# Operation wait budgets. Keep the default 5000 ms shutdown budget for the pinned MCP stdio
# process-tree cleanup unless the transport guarantee is revalidated.
startup_timeout_ms = 10000
request_timeout_ms = 30000
shutdown_timeout_ms = 5000
