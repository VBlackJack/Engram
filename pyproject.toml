[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-memory-broker"
version = "2026.0730.02"
description = "Local-first MCP memory broker with trust-aware recall and reviewed consolidation."
readme = "README.en.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julien Bombled" }]
keywords = ["mcp", "memory", "sqlite", "fts5", "local-first", "datacron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx==0.28.1",
  "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "ruff>=0.14.0",
  "types-jsonschema>=4.26.0",
]

[project.scripts]
engram = "engram.cli:main"

[project.urls]
Homepage = "https://github.com/VBlackJack/Engram"
Documentation = "https://github.com/VBlackJack/Engram/blob/main/README.md"
Source = "https://github.com/VBlackJack/Engram"
Issues = "https://github.com/VBlackJack/Engram/issues"
Changelog = "https://github.com/VBlackJack/Engram/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["engram", "engram.*", "evalsets"]
namespaces = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG005", "D100", "D101", "D102", "D103", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["ci", "src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
