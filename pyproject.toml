[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-memory-broker"
version = "2026.813.4"
description = "Local-first MCP memory broker with trust-aware recall and reviewed consolidation."
readme = "README.en.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julien Bombled" }]
keywords = ["mcp", "memory", "sqlite", "fts5", "local-first", "datacron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx==0.28.1",
  "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.14.0",
  "types-jsonschema>=4.26.0",
]

[project.scripts]
engram = "engram.cli:main"

[project.urls]
Homepage = "https://github.com/VBlackJack/Engram"
Documentation = "https://github.com/VBlackJack/Engram/blob/main/README.md"
Source = "https://github.com/VBlackJack/Engram"
Issues = "https://github.com/VBlackJack/Engram/issues"
Changelog = "https://github.com/VBlackJack/Engram/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["engram", "engram.*", "evalsets"]
namespaces = false

# The starting configuration has to reach the wheel, not only the source
# archive. Without this, an install that was not a checkout refused to start and
# named a file the user could not obtain from anywhere.
[tool.setuptools.package-data]
"engram.resources" = ["*.toml", "*.txt"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG005", "D100", "D101", "D102", "D103", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["ci", "src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["engram", "ci"]
relative_files = true

[tool.coverage.paths]
# The two continuous-integration legs check out under different roots, and one
# separates with backslashes. Without this remapping, combine has no reason to
# believe two recordings describe the same file, so it keeps both and the
# per-module totals double instead of merging. That failure is silent: the
# report still renders, it just describes a project twice the size.
engram = ["src/engram", "*/src/engram", "*\\src\\engram"]
ci = ["ci", "*/ci", "*\\ci"]

[tool.coverage.report]
# Whole-project floor. Per-module floors for the modules that lose or corrupt
# memory when they are wrong are enforced separately, because a project-wide
# average lets a well-covered periphery hide an uncovered core.
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
