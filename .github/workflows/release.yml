name: release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9].[0-9][0-9]"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.3

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.13

      - name: Install SQLite 3.53.3
        run: |
          archive="$RUNNER_TEMP/sqlite-autoconf-3530300.tar.gz"
          curl --fail --silent --show-error --location \
            https://www.sqlite.org/2026/sqlite-autoconf-3530300.tar.gz \
            --output "$archive"
          SQLITE_ARCHIVE="$archive" python -c "import hashlib, os, pathlib; value = hashlib.sha3_256(pathlib.Path(os.environ['SQLITE_ARCHIVE']).read_bytes()).hexdigest(); assert value == '98f2b3f3c11be6a03ea32346937b032c2472ebbd7a716bed36ca2f5693e7ce8b', value"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/sqlite-autoconf-3530300"
          ./configure --prefix="$RUNNER_TEMP/sqlite-3.53.3" --enable-shared --disable-static
          make -j2
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sqlite-3.53.3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify SQLite and quality gates
        run: |
          uv run --frozen --extra dev --python 3.13 python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3)"
          uv run --frozen --extra dev --python 3.13 ruff check .
          uv run --frozen --extra dev --python 3.13 ruff format --check .
          uv run --frozen --extra dev --python 3.13 mypy
          uv run --frozen --extra dev --python 3.13 pytest

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: >-
          uv run --frozen --extra dev --python 3.13 python -c
          "import os; from engram import __version__; assert os.environ['REF_NAME'] == f'v{__version__}'"

      - name: Build wheel and source archive
        run: uv build --python 3.13

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: engram-python-distributions
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: engram-python-distributions
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: dist/*
          generate_release_notes: true

  # PyPI publication is intentionally inactive until the distribution name is
  # reserved and a trusted-publishing environment is approved.
