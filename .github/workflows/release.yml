name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept identical to the quality gate in ci.yml. Two workflows building on two
  # interpreters would make the released artifact untested by construction.
  SUPPORTED_PYTHON: "3.14.6"

jobs:
  build:
    name: Verify and build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # Bootstrap only: this interpreter exists to install uv and never runs
      # Engram. The released artifact is built with SUPPORTED_PYTHON.
      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      # Same pinned interpreter as the quality gate, for the same reason: the
      # release must be built and verified on the line the documentation tells
      # users to install, not on a runtime patched for the occasion.
      - name: Install the supported interpreter
        run: uv python install ${{ env.SUPPORTED_PYTHON }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}

      - name: Verify SQLite and quality gates
        run: |
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3)"
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} ruff check .
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} ruff format --check .
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} mypy
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} pytest

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: >-
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} python -c
          "import os; from engram import __version__; assert os.environ['REF_NAME'] == f'v{__version__}'"

      - name: Build wheel and source archive
        run: uv build --python ${{ env.SUPPORTED_PYTHON }}

      # Built from the exported lock rather than from an installed environment.
      # Measured both on 2026-08-01: an environment built here on Linux lists 29
      # components, the lock lists 31 on either platform. The two missing ones
      # are colorama and pywin32, which every Windows user of this wheel does
      # install. A manifest that omits components because of where the release
      # happened to be built is wrong about the artifact it travels with, and
      # wrong in the direction that hides attack surface.
      #
      # The cost is a real one: this source leaves the root component's direct
      # dependencies undeclared, and cyclonedx-py says so on standard error. The
      # warning is expected. Component completeness is what an SBOM is consumed
      # for; the graph is not worth two silently absent packages.
      #
      # The development extra is excluded by not being requested: it is an
      # optional-dependency extra, so nothing has to be passed to leave it out.
      #
      # Rehearsable through workflow_dispatch, which runs this job without
      # running the tag-gated one below.
      - name: Build the software bill of materials
        run: |
          uv export --frozen --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --no-project --python ${{ env.SUPPORTED_PYTHON }} --with cyclonedx-bom==7.3.1 \
            cyclonedx-py requirements "$RUNNER_TEMP/runtime-requirements.txt" \
            --pyproject pyproject.toml --of JSON --sv 1.6 --output-reproducible \
            -o dist/engram-sbom.cdx.json

      # The manifest travels with the artifacts it describes. A bill of
      # materials published apart from its distribution is a document nobody can
      # tie back to what they downloaded.
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: engram-python-distributions
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: engram-python-distributions
          path: dist

      # Attests the exact files the next step publishes, not an earlier copy of
      # them. Attesting in the build job would sign artifacts that still have an
      # upload and a download to survive before anyone can fetch them.
      #
      # Artifact attestations are restricted to public repositories on the Free,
      # Pro and Team plans; a private repository would need Enterprise Cloud.
      # This repository is public, so the step is exercisable rather than taken
      # on trust, and verifying it belongs to the release itself instead of to
      # whatever happens after publishing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: dist/*
          generate_release_notes: true

  # PyPI publication is intentionally inactive until the distribution name is
  # reserved and a trusted-publishing environment is approved.
