name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one distribution measured to link a SQLite above the fail-closed floor
  # without being patched. Every other channel measured, including uv-managed
  # 3.13, links a version the WAL-reset guard rejects.
  SUPPORTED_PYTHON: "3.14.6"
  # Stock runtime for the turnkey job. Never patched, never pinned to a patch
  # release: this is whatever a user would get from the same channel.
  STOCK_PYTHON: "3.14"

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # Bootstrap only: this interpreter exists to install uv and never runs
      # Engram. The tested line is SUPPORTED_PYTHON, installed on the next step.
      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      # The supported line is the uv-managed interpreter, the only measured
      # distribution linking a SQLite above the floor without being patched.
      # Building or swapping a SQLite here would manufacture the property the
      # turnkey job exists to measure; that job runs stock, on purpose.
      - name: Install the supported interpreter
        run: uv python install ${{ env.SUPPORTED_PYTHON }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}

      # Keep the explicit assertion. The interpreter is pinned, but the SQLite
      # its build links is an upstream decision that can change without notice.
      - name: Verify SQLite safety floor
        run: >-
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} python -c
          "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3)"

      # The three static checks record a verdict instead of cancelling the run.
      # As sequential blocking steps they made a one-line formatting difference
      # produce a red build in which no test had executed, and the run page was
      # indistinguishable from a genuine test failure. Four commits reached
      # production through that gap, carrying a defect the suite would have
      # caught. Each still fails the build, at the last step of this job.
      - name: Ruff lint
        id: lint
        continue-on-error: true
        run: uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} ruff check .

      - name: Ruff format
        id: format
        continue-on-error: true
        run: uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} ruff format --check .

      - name: Mypy strict
        id: types
        continue-on-error: true
        run: uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} mypy

      # No floor is enforced here. One leg cannot see the platform branches the
      # other one executes, so a per-leg verdict would fail a module for running
      # on the wrong operating system. The floors are enforced once, on the
      # combined data, by the job below.
      - name: Pytest
        run: >-
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}
          pytest --cov --cov-report=term --cov-fail-under=0

      # Renamed before upload: the data file is hidden, and hidden files are
      # excluded from artifacts by default.
      - name: Preserve the coverage data of this leg
        shell: bash
        run: mv .coverage "coverage-data-${{ runner.os }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: coverage-data-${{ runner.os }}
          path: coverage-data-${{ runner.os }}
          if-no-files-found: error

      # Audits the locked set this run installed, not whatever resolves today.
      # An audit of a fresh resolution would describe a dependency tree the
      # tested artifact never had. --strict fails on a skipped package too,
      # so an unauditable dependency cannot pass as a clean report.
      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run --frozen --python ${{ env.SUPPORTED_PYTHON }} --with pip-audit==2.10.1 pip-audit --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

      - name: FTS evaluation contract
        env:
          ENGRAM_CONFIG: ${{ github.workspace }}/engram.example.toml
        run: >-
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}
          engram eval --mode fts --out local/ci-eval

      - name: Upload FTS evaluation artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: fts-eval-${{ runner.os }}
          path: |
            local/ci-eval/metrics.json
            local/ci-eval/rapport-eval.md
          if-no-files-found: warn

      # The verdict the three deferred checks earned. Placed last so every other
      # step has already reported: a run that fails here still says, on the same
      # page, whether the tests passed.
      - name: Enforce the static verdicts
        if: always()
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
        run: |
          status=0
          for check in "ruff check:$LINT_OUTCOME" "ruff format:$FORMAT_OUTCOME" "mypy:$TYPES_OUTCOME"; do
            name="${check%:*}"
            outcome="${check##*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name reported $outcome"
              status=1
            fi
          done
          exit "$status"

  # One verdict, on the union of both legs. process_lock.py is the single-writer
  # guarantee and it branches on the operating system: the POSIX half is dead
  # code on Windows and the Windows half is dead code on Linux. Judged per leg,
  # the module is penalised for code the other leg runs. Marking those branches
  # exempt would be worse still, since it would leave half of the mechanism the
  # whole storage design rests on measured nowhere.
  coverage:
    name: Coverage floors (combined)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Install the supported interpreter
        run: uv python install ${{ env.SUPPORTED_PYTHON }}

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}

      - name: Download every leg
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      # combine relies on [tool.coverage.paths] to recognise two recordings of
      # the same file. Without that remapping it unions nothing and the totals
      # double, and the report still renders: the failure has no error message.
      - name: Combine both legs
        run: >-
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }}
          coverage combine coverage-data/coverage-data-Linux coverage-data/coverage-data-Windows

      # Two floors, two mechanisms. coverage report enforces the project-wide
      # one from the coverage configuration; the per-module one is separate
      # because an average is not a floor, and a well-covered periphery would
      # otherwise answer for a thin core.
      - name: Enforce the coverage floors
        run: |
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} coverage report
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} coverage json -o coverage.json
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} python -m ci.coverage_floors --report coverage.json
          uv run --frozen --extra dev --python ${{ env.SUPPORTED_PYTHON }} coverage xml

      - name: Upload the combined report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: coverage-combined
          path: coverage.xml
          if-no-files-found: warn

  # What a Windows user actually gets. The quality gate above pins the one
  # interpreter measured to work, which answers nothing about the runtime a
  # user already has. This job installs the distribution on a stock runtime and
  # asserts the disjunction that is genuinely true of it: either the linked
  # SQLite clears the floor and the command works, or it does not and the
  # command refuses with the documented exit code and message. The refusal
  # message is the whole product surface of a failed installation.
  turnkey:
    name: Turnkey contract (stock Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up the stock interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.STOCK_PYTHON }}

      # Installed the way a user installs it, from the distribution rather than
      # from a synchronised lock file. A silent install proves nothing on its
      # own, which is exactly why the contract is asserted afterwards.
      - name: Install the distribution
        run: python -m pip install .

      - name: Assert the turnkey contract
        id: cold
        run: >-
          python -m ci.coldstart
          --repository ${{ github.workspace }}
          --directory ${{ runner.temp }}\engram-cold

      # The documented repair path. It used to be exercised only as a side
      # effect of the quality gate patching its own runner, which measured
      # nothing. Here it runs where it is meant to: on a runtime that genuinely
      # fails, right after the refusal proved the runtime fails.
      - name: Apply the documented DLL repair
        if: steps.cold.outputs.floor-satisfied == 'false'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3530300.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sqlite-dll-win-x64-3530300"
          Invoke-WebRequest `
            -Uri "https://www.sqlite.org/2026/sqlite-dll-win-x64-3530300.zip" `
            -OutFile $archive
          $env:SQLITE_ARCHIVE = $archive
          python -c "import hashlib, os, pathlib; value = hashlib.sha3_256(pathlib.Path(os.environ['SQLITE_ARCHIVE']).read_bytes()).hexdigest(); assert value == '3a494861ce24d1f330efbc6c3fb58ce4972f2cf8df4e43122246ed987109dc8a', value"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $target = Get-ChildItem -Path $env:pythonLocation -Recurse -Filter "sqlite3.dll" |
            Select-Object -First 1
          if ($null -eq $target) {
            throw "sqlite3.dll was not found in the managed Python runtime."
          }
          Copy-Item -LiteralPath (Join-Path $extract "sqlite3.dll") `
            -Destination $target.FullName -Force

      - name: Assert the repair restores a working runtime
        if: steps.cold.outputs.floor-satisfied == 'false'
        run: >-
          python -m ci.coldstart
          --repository ${{ github.workspace }}
          --directory ${{ runner.temp }}\engram-repaired

      # A green run must never be mistaken for coverage it did not provide.
      - name: Report that the repair path went unexercised
        if: steps.cold.outputs.floor-satisfied == 'true'
        run: >-
          echo "::warning::The stock runtime already clears the SQLite floor. The
          refusal contract and the documented DLL repair were not exercised by this run."
