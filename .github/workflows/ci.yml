name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install uv and managed Python
        run: |
          python -m pip install uv==0.11.3
          uv python install 3.14.3

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.14.3

      # uv's managed CPython 3.14.3 build embeds a patched SQLite. Keep the
      # explicit assertion: Engram refuses SQLite versions affected by the
      # WAL-reset bug, regardless of the runner's system Python.
      - name: Verify SQLite safety floor
        run: >-
          uv run --frozen --extra dev --python 3.14.3 python -c
          "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3)"

      - name: Ruff lint
        run: uv run --frozen --extra dev --python 3.14.3 ruff check .

      - name: Ruff format
        run: uv run --frozen --extra dev --python 3.14.3 ruff format --check .

      - name: Mypy strict
        run: uv run --frozen --extra dev --python 3.14.3 mypy

      - name: Pytest
        run: uv run --frozen --extra dev --python 3.14.3 pytest
